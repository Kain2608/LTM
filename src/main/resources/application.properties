spring.application.name=poker-server

# Cấu hình MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/poker_online?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sesame
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hikari Pool
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000

# Cấu hình JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
poker.app.jwtSecret=======================PokerOnlineSecretKey1234567890===========================
poker.app.jwtExpirationMs=86400000